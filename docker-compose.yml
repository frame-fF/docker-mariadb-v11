services:
  mariadb_11:
    image: lscr.io/linuxserver/mariadb:11.8.8
    container_name: mariadb_11
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Bangkok
      - MYSQL_USER=root
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_PASSWORD=password
    volumes:
      - data:/config
    ports:
      - 127.0.0.1:3306:3306
    restart: unless-stopped

volumes:
  data:

networks:
  default:
    external: true
    name: base
