services:
  db:
    container_name: mariadb-11
    image: lscr.io/linuxserver/mariadb:11.8.8
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Bangkok
      - MYSQL_USER=root
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_PASSWORD=password
    restart: unless-stopped
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - data:/config

volumes:
  data:

networks:
  default:
    external: true
    name: base
